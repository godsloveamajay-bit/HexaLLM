[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nebulacode"
version = "0.10.1"
summary = "NebulaCode — AI coding assistant for the terminal"
description = "NebulaCode — AI coding assistant for the terminal"
readme = "README_CLI.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.25",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "websockets>=12.0",
]

[project.scripts]
nebula = "nebula_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nebula_code"]
