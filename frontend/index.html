<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141009" />
    <!-- Apply saved theme before paint to avoid a flash. Default: dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          if (t === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NebulaX AI" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/pwa-144.png" />
    <title>NebulaX AI Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
