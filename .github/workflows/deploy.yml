name: Build & Push images

# Builds backend + frontend images, tags them with the short SHA (and a
# rolling `prod` tag), and pushes to GHCR. The server's deploy.sh pulls the
# sha-* tag after `git pull`, so rollback = re-run with the previous SHA.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'compose.dev.yml'
      - 'deploy/docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/godsloveamajay-bit

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/hexallm-backend:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE_NS }}/hexallm-backend:prod

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/hexallm-frontend:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE_NS }}/hexallm-frontend:prod
