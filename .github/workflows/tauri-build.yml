name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust (macOS universal)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const conf = JSON.parse(fs.readFileSync('frontend/src-tauri/tauri.conf.json', 'utf8'));
          conf.version = version;
          fs.writeFileSync('frontend/src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          const cargo = fs.readFileSync('frontend/src-tauri/Cargo.toml', 'utf8');
          fs.writeFileSync('frontend/src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"/m, 'version = \"' + version + '\"'));
          console.log('Version set to', version);
          "

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ai.nebualax.co.uk/api/v1' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'NebulaX AI ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            | Platform | File |
            |---|---|
            | Windows | `.msi` or `.exe` (NSIS) |
            | macOS | `.dmg` (universal — Intel + Apple Silicon) |
            | Linux (Ubuntu/Debian) | `.deb` |
            | Linux (any) | `.AppImage` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Upload the updater archives + signatures that tauri-action skips
      - name: Upload updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          set +e  # missing dirs/files are expected on other-platform runners

          upload() {
            local f="$1"
            [ -f "$f" ] || return 0
            local name
            name=$(basename "$f" | tr ' ' '.')
            cp "$f" "/tmp/$name"
            gh release upload "$TAG" "/tmp/$name" --clobber --repo "$REPO" \
              && echo "Uploaded: $name" || echo "Skip (already exists): $name"
          }

          # Find all updater artifacts in one pass; -o requires grouping parens
          while IFS= read -r -d '' f; do
            upload "$f"
          done < <(find frontend/src-tauri/target \
            \( -name "*.AppImage.tar.gz"     \
            -o -name "*.AppImage.tar.gz.sig" \
            -o -name "*.app.tar.gz"          \
            -o -name "*.app.tar.gz.sig"      \
            -o -name "*.nsis.zip"            \
            -o -name "*.nsis.zip.sig"        \
            -o -name "*.msi.zip"             \
            -o -name "*.msi.zip.sig"         \
            \) -not -path "*/deps/*" -print0 2>/dev/null || true)

  build-android:
    needs: build-tauri
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" 2>/dev/null | grep -v "^Unpacking\|^Downloading" || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ai.nebualax.co.uk/api/v1' }}

      - name: Sync Capacitor to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=${patch:-0}
          VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" frontend/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" frontend/android/app/build.gradle
          echo "Version: $VERSION ($VERSION_CODE)"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | tr -d '[:space:]' \
            | base64 -d > /tmp/nebulax.keystore

      - name: Build release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_PATH: /tmp/nebulax.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -f "$APK" ] || (echo "APK not found" && exit 1)
          NAME="NebulaX-AI-${GITHUB_REF_NAME}-android.apk"
          cp "$APK" "/tmp/$NAME"
          gh release upload "$GITHUB_REF_NAME" "/tmp/$NAME" --clobber --repo "${{ github.repository }}"
          echo "Uploaded: $NAME"

  publish-updater-json:
    needs: build-tauri
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p /tmp/assets
          gh release download "$TAG" --repo "$REPO" --dir /tmp/assets

          python3 << 'PYEOF'
          import json, os, glob, datetime
          tag     = os.environ['GITHUB_REF_NAME']
          repo    = os.environ['REPO']
          version = tag.lstrip('v')
          base    = f"https://github.com/{repo}/releases/download/{tag}"
          def find_sig(p):
              files = glob.glob(f"/tmp/assets/{p}")
              return open(files[0]).read().strip() if files else None
          def asset_url(p):
              files = glob.glob(f"/tmp/assets/{p}")
              return (base + '/' + os.path.basename(files[0]).replace(' ', '.')) if files else None
          data = {"version": version, "notes": "", "pub_date": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'), "platforms": {}}
          sig = find_sig("*.AppImage.tar.gz.sig"); url = asset_url("*.AppImage.tar.gz")
          if sig and url: data["platforms"]["linux-x86_64"] = {"signature": sig, "url": url}
          sig = find_sig("*.nsis.zip.sig") or find_sig("*.msi.zip.sig"); url = asset_url("*.nsis.zip") or asset_url("*.msi.zip")
          if sig and url: data["platforms"]["windows-x86_64"] = {"signature": sig, "url": url}
          sig = find_sig("*.app.tar.gz.sig"); url = asset_url("*.app.tar.gz")
          if sig and url:
              data["platforms"]["darwin-x86_64"]  = {"signature": sig, "url": url}
              data["platforms"]["darwin-aarch64"] = {"signature": sig, "url": url}
          print(json.dumps(data, indent=2))
          open("/tmp/latest.json", "w").write(json.dumps(data, indent=2))
          PYEOF

          gh release upload "$TAG" /tmp/latest.json --clobber --repo "$REPO"
          echo "latest.json uploaded successfully"
