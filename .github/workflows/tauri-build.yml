name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust (macOS universal)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const conf = JSON.parse(fs.readFileSync('frontend/src-tauri/tauri.conf.json', 'utf8'));
          conf.version = version;
          fs.writeFileSync('frontend/src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          const cargo = fs.readFileSync('frontend/src-tauri/Cargo.toml', 'utf8');
          fs.writeFileSync('frontend/src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"/m, 'version = \"' + version + '\"'));
          console.log('Version set to', version);
          "

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ai.nebualax.co.uk/api/v1' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'NebulaX AI ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            | Platform | File |
            |---|---|
            | Windows | `.msi` or `.exe` (NSIS) |
            | macOS | `.dmg` (universal — Intel + Apple Silicon) |
            | Linux (Ubuntu/Debian) | `.deb` |
            | Linux (any) | `.AppImage` |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Upload the updater archives + signatures that tauri-action skips
      - name: Upload updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          set +e  # missing dirs/files are expected on other-platform runners

          upload() {
            local f="$1"
            [ -f "$f" ] || return 0
            local name
            name=$(basename "$f" | tr ' ' '.')
            cp "$f" "/tmp/$name"
            gh release upload "$TAG" "/tmp/$name" --clobber --repo "$REPO" \
              && echo "Uploaded: $name" || echo "Skip (already exists): $name"
          }

          # Find all updater artifacts in one pass; -o requires grouping parens
          while IFS= read -r -d '' f; do
            upload "$f"
          done < <(find frontend/src-tauri/target \
            \( -name "*.AppImage.tar.gz"     \
            -o -name "*.AppImage.tar.gz.sig" \
            -o -name "*.app.tar.gz"          \
            -o -name "*.app.tar.gz.sig"      \
            -o -name "*.nsis.zip"            \
            -o -name "*.nsis.zip.sig"        \
            -o -name "*.msi.zip"             \
            -o -name "*.msi.zip.sig"         \
            \) -not -path "*/deps/*" -print0 2>/dev/null || true)

  publish-updater-json:
    needs: build-tauri
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          mkdir -p /tmp/assets
          gh release download "$TAG" --repo "$REPO" --dir /tmp/assets

          python3 << 'PYEOF'
          import json, os, glob

          tag     = os.environ['GITHUB_REF_NAME']
          repo    = os.environ['REPO']
          version = tag.lstrip('v')
          base    = f"https://github.com/{repo}/releases/download/{tag}"

          def find_sig(pattern):
              files = glob.glob(f"/tmp/assets/{pattern}")
              return open(files[0]).read().strip() if files else None

          def asset_url(pattern):
              files = glob.glob(f"/tmp/assets/{pattern}")
              if not files:
                  return None
              return base + '/' + os.path.basename(files[0]).replace(' ', '.')

          data = {
              "version": version,
              "notes": "",
              "pub_date": __import__('datetime').datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              "platforms": {}
          }

          # Linux
          sig = find_sig("*.AppImage.tar.gz.sig")
          url = asset_url("*.AppImage.tar.gz")
          if sig and url:
              data["platforms"]["linux-x86_64"] = {"signature": sig, "url": url}

          # Windows (NSIS preferred, MSI fallback)
          sig = find_sig("*.nsis.zip.sig") or find_sig("*.msi.zip.sig")
          url = asset_url("*.nsis.zip") or asset_url("*.msi.zip")
          if sig and url:
              data["platforms"]["windows-x86_64"] = {"signature": sig, "url": url}

          # macOS universal — register for both Intel and Apple Silicon
          sig = find_sig("*.app.tar.gz.sig")
          url = asset_url("*.app.tar.gz")
          if sig and url:
              data["platforms"]["darwin-x86_64"]  = {"signature": sig, "url": url}
              data["platforms"]["darwin-aarch64"] = {"signature": sig, "url": url}

          print(json.dumps(data, indent=2))
          with open("/tmp/latest.json", "w") as f:
              json.dump(data, f, indent=2)
          PYEOF

          gh release upload "$TAG" /tmp/latest.json --clobber --repo "$REPO"
          echo "latest.json uploaded successfully"
