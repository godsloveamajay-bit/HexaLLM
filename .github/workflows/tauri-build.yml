name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust (macOS universal)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const conf = JSON.parse(fs.readFileSync('frontend/src-tauri/tauri.conf.json', 'utf8'));
          conf.version = version;
          fs.writeFileSync('frontend/src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          const cargo = fs.readFileSync('frontend/src-tauri/Cargo.toml', 'utf8');
          fs.writeFileSync('frontend/src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"/m, 'version = \"' + version + '\"'));
          console.log('Version set to', version);
          "

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ai.nebualax.co.uk/api/v1' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: NebulaX AI ${{ github.ref_name }}
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadPlainBinary: true

      # tauri-action deletes .sig files and updater archives after its own (broken)
      # updater-JSON pass.  We recreate the updater bundles from the surviving
      # installers, sign them ourselves, and upload bundle + sig to the release.
      - name: Create, sign and upload updater bundles
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "No signing key – skipping"; exit 0; }
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          TAURI_BIN="$PWD/frontend/node_modules/.bin/tauri"
          WORKDIR="${RUNNER_TEMP:-/tmp}"
          set +e

          # Sign $WORKDIR/$name and upload both the bundle and the .sig
          sign_upload() {
            local name="$1"
            local src="$WORKDIR/$name"
            [ -f "$src" ] || { echo "SKIP (not found): $name"; return; }
            (cd frontend && "$TAURI_BIN" signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$src")
            [ -f "${src}.sig" ] || { echo "Sign failed: $name"; return; }
            echo "Signed: $name"
            gh release upload "$TAG" "$src"     --clobber --repo "$REPO" && echo "Uploaded: $name"
            gh release upload "$TAG" "${src}.sig" --clobber --repo "$REPO" && echo "Uploaded: ${name}.sig"
          }

          # ── Linux: wrap AppImage in .tar.gz and sign ─────────────────────
          for f in frontend/src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            AINAME=$(basename "$f")
            TARNAME="$(echo "$AINAME" | tr ' ' '.').tar.gz"
            tar czf "$WORKDIR/$TARNAME" -C "$(dirname "$f")" "$AINAME"
            sign_upload "$TARNAME"; break
          done

          # ── macOS: tauri-action keeps the .app.tar.gz — just sign it ─────
          for f in frontend/src-tauri/target/*/release/bundle/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            TARNAME="$(basename "$f" | tr ' ' '.')"
            cp "$f" "$WORKDIR/$TARNAME"
            sign_upload "$TARNAME"
          done

          # ── Windows: zip the NSIS exe and sign ───────────────────────────
          for f in frontend/src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] || continue
            EXENAME=$(basename "$f")
            ZIPNAME="$(echo "$EXENAME" | tr ' ' '.').nsis.zip"
            ZOUT="$WORKDIR/$ZIPNAME" ZDIR="$(dirname "$f")" ZFILE="$EXENAME" python3 -c "import zipfile,os; z=zipfile.ZipFile(os.environ['ZOUT'],'w',8); z.write(os.path.join(os.environ['ZDIR'],os.environ['ZFILE']),os.environ['ZFILE']); z.close()"
            sign_upload "$ZIPNAME"; break
          done

          # ── Windows: zip the MSI and sign ────────────────────────────────
          for f in frontend/src-tauri/target/release/bundle/msi/*.msi; do
            [ -f "$f" ] || continue
            MSINAME=$(basename "$f")
            ZIPNAME="$(echo "$MSINAME" | tr ' ' '.').msi.zip"
            ZOUT="$WORKDIR/$ZIPNAME" ZDIR="$(dirname "$f")" ZFILE="$MSINAME" python3 -c "import zipfile,os; z=zipfile.ZipFile(os.environ['ZOUT'],'w',8); z.write(os.path.join(os.environ['ZDIR'],os.environ['ZFILE']),os.environ['ZFILE']); z.close()"
            sign_upload "$ZIPNAME"; break
          done

  build-android:
    needs: build-tauri
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" 2>/dev/null | grep -v "^Unpacking\|^Downloading" || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://ai.nebualax.co.uk/api/v1' }}

      - name: Sync Capacitor to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=${patch:-0}
          VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" frontend/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" frontend/android/app/build.gradle
          echo "Version: $VERSION ($VERSION_CODE)"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | tr -d '[:space:]' \
            | base64 -d > /tmp/nebulax.keystore

      - name: Build release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_PATH: /tmp/nebulax.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -f "$APK" ] || (echo "APK not found" && exit 1)
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="nebulax-ai-${VERSION}-android.apk"
          cp "$APK" "/tmp/$NAME"
          gh release upload "$GITHUB_REF_NAME" "/tmp/$NAME" --clobber --repo "${{ github.repository }}"
          echo "Uploaded: $NAME"

  publish-updater-json:
    needs: build-tauri
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p /tmp/assets
          gh release download "$TAG" --repo "$REPO" --dir /tmp/assets

          python3 << 'PYEOF'
          import json, os, glob, datetime
          tag     = os.environ['GITHUB_REF_NAME']
          repo    = os.environ['REPO']
          version = tag.lstrip('v')
          base    = f"https://github.com/{repo}/releases/download/{tag}"
          def sig_url(sig_pattern):
              """Return (sig_content, download_url) derived from the .sig file itself."""
              files = sorted(glob.glob(f"/tmp/assets/{sig_pattern}"))
              if not files: return None, None
              sf   = files[0]
              sig  = open(sf).read().strip()
              # bundle = sig filename without the trailing .sig
              bundle = os.path.basename(sf)[:-4]
              if not os.path.isfile(f"/tmp/assets/{bundle}"): return None, None
              return sig, f"{base}/{bundle}"
          data = {"version": version, "notes": "", "pub_date": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'), "platforms": {}}
          sig, url = sig_url("*.AppImage.tar.gz.sig")
          if sig and url: data["platforms"]["linux-x86_64"] = {"signature": sig, "url": url}
          sig, url = sig_url("*.nsis.zip.sig")
          if not sig: sig, url = sig_url("*.msi.zip.sig")
          if sig and url: data["platforms"]["windows-x86_64"] = {"signature": sig, "url": url}
          sig, url = sig_url("*.app.tar.gz.sig")
          if sig and url:
              data["platforms"]["darwin-x86_64"]  = {"signature": sig, "url": url}
              data["platforms"]["darwin-aarch64"] = {"signature": sig, "url": url}
          print(json.dumps(data, indent=2))
          open("/tmp/latest.json", "w").write(json.dumps(data, indent=2))
          PYEOF

          gh release upload "$TAG" /tmp/latest.json --clobber --repo "$REPO"
          echo "latest.json uploaded successfully"
