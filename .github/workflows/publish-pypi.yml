name: Publish CLI to PyPI

# Builds the NebulaCode CLI (the `nebulacode` package) and publishes it to PyPI
# whenever a v* tag is pushed — the same tag that triggers the desktop/mobile
# builds in tauri-build.yml. Also attaches the wheel + sdist to the GitHub
# Release so they're downloadable alongside the installers.
#
# Auth: set a repository secret `PYPI_API_TOKEN` (a PyPI API token, value starts
# with `pypi-`). Alternatively, configure PyPI Trusted Publishing for this repo
# + workflow and delete the `password:` line below — the `id-token: write`
# permission is already granted for that path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # upload artifacts to the release
  id-token: write   # PyPI trusted publishing (OIDC) fallback

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify package version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(grep -m1 -E '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG_VERSION  pyproject=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match pyproject version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Attach artifacts to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The release may be created by tauri-build.yml; create it if it isn't
          # there yet so the upload never races to a missing release.
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "NebulaX AI $TAG" --notes "" --verify-tag || true
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz \
            --clobber --repo "${{ github.repository }}"
