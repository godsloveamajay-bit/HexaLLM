name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-core.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt pytest pytest-asyncio

      - name: Compile
        run: python -m compileall -q app

      - name: Run plugin self-tests
        run: |
          for f in plugins/_sandbox_selftest.py plugins/_ratelimit_selftest.py plugins/_retention_selftest.py plugins/_budget_selftest.py; do
            python "$f"
          done

      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  e2e:
    name: GUI smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-core.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Seed E2E data
        working-directory: backend
        run: python scripts/seed_e2e.py

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run GUI smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          cd ../backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          cd ../frontend
          npm run dev -- --port 3000 > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null && curl -sf http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
          kill $FRONTEND_PID $BACKEND_PID || true
